[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for heart disease prediction (UCI Cleveland dataset)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
