<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .lane {fill:none;stroke:#cbd5e1;stroke-width:1}
      .lane-label {font-weight:600;fill:#0f172a}
      .lane-sub {font-weight:400;font-size:11.5px;fill:#64748b}
      .box {fill:#ffffff;stroke:#64748b;stroke-width:1.25;rx:8;ry:8}
      .box-main {fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:8;ry:8}
      .box-name {font-weight:600;fill:#0f172a;text-anchor:middle}
      .box-sub {font-size:11.5px;fill:#64748b;text-anchor:middle}
      .edge {fill:none;stroke:#64748b;stroke-width:1.25}
      .quiet {font-size:11.5px;fill:#64748b;text-anchor:middle}
      .title {font-size:16px;font-weight:600;fill:#0f172a}
    </style>
  </defs>

  <text x="20" y="30" class="title">From raw data to a monitored API in four stages</text>

  <!-- lanes -->
  <rect class="lane" x="20" y="60" width="960" height="110"/>
  <rect class="lane" x="20" y="190" width="960" height="110"/>
  <rect class="lane" x="20" y="320" width="960" height="110"/>
  <rect class="lane" x="20" y="450" width="960" height="110"/>

  <!-- lane labels -->
  <text x="35" y="100" class="lane-label">1  Build</text>
  <text x="35" y="118" class="lane-sub">the model</text>

  <text x="35" y="230" class="lane-label">2  Automate</text>
  <text x="35" y="248" class="lane-sub">every push</text>

  <text x="35" y="360" class="lane-label">3  Serve</text>
  <text x="35" y="378" class="lane-sub">and deploy</text>

  <text x="35" y="490" class="lane-label">4  Observe</text>
  <text x="35" y="508" class="lane-sub">the service</text>

  <!-- Lane 1: Build -->
  <rect class="box" x="150" y="80" width="130" height="60"/>
  <text x="215" y="107" class="box-name">UCI data</text>
  <text x="215" y="124" class="box-sub">download.py</text>

  <rect class="box" x="310" y="80" width="130" height="60"/>
  <text x="375" y="107" class="box-name">Clean, EDA</text>
  <text x="375" y="124" class="box-sub">preprocess.py</text>

  <rect class="box" x="470" y="80" width="130" height="60"/>
  <text x="535" y="107" class="box-name">Train, tune</text>
  <text x="535" y="124" class="box-sub">3 models, CV</text>

  <rect class="box" x="630" y="80" width="130" height="60"/>
  <text x="695" y="107" class="box-name">Model files</text>
  <text x="695" y="124" class="box-sub">joblib + card</text>

  <rect class="box" x="790" y="80" width="130" height="60"/>
  <text x="855" y="107" class="box-name">MLflow</text>
  <text x="855" y="124" class="box-sub">registry</text>

  <path class="edge" d="M280 110 L310 110" marker-end="url(#arrow)"/>
  <path class="edge" d="M440 110 L470 110" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 110 L630 110" marker-end="url(#arrow)"/>
  <path class="edge" d="M760 110 L790 110" marker-end="url(#arrow)"/>

  <!-- Lane 2: CI -->
  <rect class="box" x="150" y="210" width="130" height="60"/>
  <text x="215" y="237" class="box-name">git push</text>
  <text x="215" y="254" class="box-sub">to GitHub</text>

  <rect class="box" x="310" y="210" width="130" height="60"/>
  <text x="375" y="237" class="box-name">lint</text>
  <text x="375" y="254" class="box-sub">ruff</text>

  <rect class="box" x="470" y="210" width="130" height="60"/>
  <text x="535" y="237" class="box-name">test</text>
  <text x="535" y="254" class="box-sub">150 pytest</text>

  <rect class="box" x="630" y="210" width="130" height="60"/>
  <text x="695" y="237" class="box-name">train</text>
  <text x="695" y="254" class="box-sub">10 trials</text>

  <rect class="box" x="790" y="210" width="130" height="60"/>
  <text x="855" y="237" class="box-name">docker</text>
  <text x="855" y="254" class="box-sub">build + push</text>

  <path class="edge" d="M280 240 L310 240" marker-end="url(#arrow)"/>
  <path class="edge" d="M440 240 L470 240" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 240 L630 240" marker-end="url(#arrow)"/>
  <path class="edge" d="M760 240 L790 240" marker-end="url(#arrow)"/>

  <!-- Lane 3: Serve -->
  <rect class="box" x="150" y="340" width="130" height="60"/>
  <text x="215" y="367" class="box-name">Image</text>
  <text x="215" y="384" class="box-sub">FastAPI+model</text>

  <rect class="box" x="310" y="340" width="130" height="60"/>
  <text x="375" y="367" class="box-name">Helm chart</text>
  <text x="375" y="384" class="box-sub">deploy/helm</text>

  <rect class="box-main" x="470" y="340" width="130" height="60"/>
  <text x="535" y="367" class="box-name">Kubernetes</text>
  <text x="535" y="384" class="box-sub">2 replicas</text>

  <rect class="box" x="630" y="340" width="130" height="60"/>
  <text x="695" y="367" class="box-name">Service</text>
  <text x="695" y="384" class="box-sub">LoadBalancer</text>

  <rect class="box" x="790" y="340" width="130" height="60"/>
  <text x="855" y="367" class="box-name">Client</text>
  <text x="855" y="384" class="box-sub">POST /predict</text>

  <path class="edge" d="M280 370 L310 370" marker-end="url(#arrow)"/>
  <path class="edge" d="M440 370 L470 370" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 370 L630 370" marker-end="url(#arrow)"/>
  <path class="edge" d="M760 370 L790 370" marker-end="url(#arrow)"/>

  <!-- Lane 4: Observe -->
  <rect class="box" x="310" y="470" width="130" height="60"/>
  <text x="375" y="497" class="box-name">Logs</text>
  <text x="375" y="514" class="box-sub">JSON lines</text>

  <rect class="box" x="470" y="470" width="130" height="60"/>
  <text x="535" y="497" class="box-name">Metrics</text>
  <text x="535" y="514" class="box-sub">/metrics</text>

  <rect class="box" x="630" y="470" width="130" height="60"/>
  <text x="695" y="497" class="box-name">Prometheus</text>
  <text x="695" y="514" class="box-sub">scrape 15 s</text>

  <rect class="box" x="790" y="470" width="130" height="60"/>
  <text x="855" y="497" class="box-name">Grafana</text>
  <text x="855" y="514" class="box-sub">9 panels</text>

  <path class="edge" d="M600 500 L630 500" marker-end="url(#arrow)"/>
  <path class="edge" d="M760 500 L790 500" marker-end="url(#arrow)"/>

  <!-- cross-lane connectors -->
  <!-- docker image to Image box -->
  <path class="edge" d="M855 270 L855 310 L215 310 L215 340" marker-end="url(#arrow)"/>
  <text x="500" y="305" class="quiet">image to GHCR, pulled into Minikube</text>

  <!-- K8s to Logs -->
  <path class="edge" d="M535 400 L535 440 L375 440 L375 470" marker-end="url(#arrow)"/>
  <!-- K8s to Metrics -->
  <path class="edge" d="M535 400 L535 470" marker-end="url(#arrow)"/>
</svg>
